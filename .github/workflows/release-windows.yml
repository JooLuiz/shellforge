name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Run root tests
        run: npm test

      - name: Run UI tests
        run: npm run ui:test

      - name: Prepare runtime bundle
        run: node ui/scripts/prepare-runtime-bundle.mjs

      - name: Build and package ShellForge
        run: npm run dist --prefix ui

      - name: Publish Windows installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/ShellForge-Setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
